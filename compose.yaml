services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: billvision
      POSTGRES_DB: billvision
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billvision -d billvision"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
