[project]
name = "bill-vision-agent"
version = "0.1.0"
description = "Local, evidence-based invoice review demo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "docling==2.55.1",
  "fastapi==0.118.0",
  "pydantic==2.11.9",
  "pydantic-settings==2.11.0",
  "streamlit==1.50.0",
  "psycopg[binary]==3.2.10",
  "uvicorn==0.37.0",
  "python-multipart==0.0.20",
  "requests==2.32.5",
  "PyYAML==6.0.3",
  "pypdf==6.1.1",
  "Pillow==11.3.0",
  "reportlab==4.4.4",
  "torch==2.8.0",
  "torchvision==0.23.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
